<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku Solver</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f13;
      color: #e8e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 24px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 28px;
      letter-spacing: 0.3px;
    }

    .board-wrapper {
      background: #1a1a24;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 0 0 1px #2a2a3a, 0 20px 60px rgba(0,0,0,0.5);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 2px;
      background: #2a2a3a;
      border: 3px solid #4c4c6a;
      border-radius: 8px;
      overflow: hidden;
    }

    /* Thick borders between 3x3 boxes */
    .cell {
      width: 52px;
      height: 52px;
      background: #1a1a24;
      border: none;
      outline: none;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 600;
      color: #e8e8f0;
      cursor: pointer;
      transition: background 0.15s;
      caret-color: #a78bfa;
    }

    .cell:focus { background: #252535; }
    .cell:hover:not(:focus) { background: #20202e; }

    /* Right border after columns 3 and 6 */
    .cell:nth-child(9n+3),
    .cell:nth-child(9n+6) {
      border-right: 3px solid #4c4c6a;
    }

    /* Bottom border after rows 3 and 6 */
    .cell:nth-child(n+19):nth-child(-n+27),
    .cell:nth-child(n+46):nth-child(-n+54) {
      border-bottom: 3px solid #4c4c6a;
    }

    .cell.given {
      color: #a78bfa;
    }

    .cell.solved {
      color: #34d399;
      animation: pop 0.2s ease;
    }

    .cell.error {
      color: #f87171;
      background: #2a1a1a;
    }

    @keyframes pop {
      0%   { transform: scale(0.85); }
      60%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 22px;
      border-radius: 10px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }

    button:active { transform: scale(0.96); }

    .btn-solve {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
    }

    .btn-solve:hover { opacity: 0.9; }

    .btn-clear {
      background: #2a2a3a;
      color: #a0a0b8;
      border: 1px solid #3a3a4a;
    }

    .btn-clear:hover { background: #323244; color: #e8e8f0; }

    .btn-example {
      background: #2a2a3a;
      color: #a0a0b8;
      border: 1px solid #3a3a4a;
    }

    .btn-example:hover { background: #323244; color: #e8e8f0; }

    .status {
      margin-top: 14px;
      font-size: 0.82rem;
      text-align: center;
      min-height: 20px;
      color: #6b7280;
      letter-spacing: 0.3px;
    }

    .status.success { color: #34d399; }
    .status.error   { color: #f87171; }
  </style>
</head>
<body>

  <h1>Sudoku Solver</h1>
  <p class="subtitle">Enter your puzzle and hit Solve</p>

  <div class="board-wrapper">
    <div class="board" id="board"></div>

    <div class="controls">
      <button class="btn-example" onclick="loadExample()">Load Example</button>
      <button class="btn-clear"   onclick="clearBoard()">Clear</button>
      <button class="btn-solve"   onclick="solve()">Solve</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script>
    const board = document.getElementById('board');
    const status = document.getElementById('status');
    const cells = [];

    // Build grid
    for (let i = 0; i < 81; i++) {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.maxLength = 1;
      inp.className = 'cell';
      inp.dataset.idx = i;
      inp.addEventListener('keydown', onKey);
      inp.addEventListener('input', onInput);
      board.appendChild(inp);
      cells.push(inp);
    }

    function onInput(e) {
      const v = e.target.value.replace(/[^1-9]/g, '');
      e.target.value = v ? v[v.length - 1] : '';
      e.target.classList.remove('solved', 'error');
      setStatus('');
    }

    function onKey(e) {
      const idx = parseInt(e.target.dataset.idx);
      const moves = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 9, ArrowUp: -9 };
      if (moves[e.key] !== undefined) {
        e.preventDefault();
        const next = idx + moves[e.key];
        if (next >= 0 && next < 81) cells[next].focus();
      }
    }

    function getGrid() {
      return cells.map(c => parseInt(c.value) || 0);
    }

    function setStatus(msg, type = '') {
      status.textContent = msg;
      status.className = 'status ' + type;
    }

    function clearBoard() {
      cells.forEach(c => {
        c.value = '';
        c.className = 'cell';
        c.disabled = false;
      });
      setStatus('');
    }

    function loadExample() {
      clearBoard();
      const puzzle =
        '530070000' +
        '600195000' +
        '098000060' +
        '800060003' +
        '400803001' +
        '700020006' +
        '060000280' +
        '000419005' +
        '000080079';
      puzzle.split('').forEach((ch, i) => {
        if (ch !== '0') {
          cells[i].value = ch;
          cells[i].classList.add('given');
        }
      });
      setStatus('Example puzzle loaded');
    }

    // ── Solver ──────────────────────────────────────────────────────────────

    function isValid(grid, pos, num) {
      const row = Math.floor(pos / 9);
      const col = pos % 9;
      const boxRow = Math.floor(row / 3) * 3;
      const boxCol = Math.floor(col / 3) * 3;

      for (let i = 0; i < 9; i++) {
        if (grid[row * 9 + i] === num) return false;       // row
        if (grid[i * 9 + col] === num) return false;       // col
        const br = boxRow + Math.floor(i / 3);
        const bc = boxCol + (i % 3);
        if (grid[br * 9 + bc] === num) return false;       // box
      }
      return true;
    }

    function backtrack(grid) {
      const empty = grid.indexOf(0);
      if (empty === -1) return true; // solved

      for (let num = 1; num <= 9; num++) {
        if (isValid(grid, empty, num)) {
          grid[empty] = num;
          if (backtrack(grid)) return true;
          grid[empty] = 0;
        }
      }
      return false;
    }

    function validateInput(grid) {
      for (let pos = 0; pos < 81; pos++) {
        const v = grid[pos];
        if (!v) continue;
        grid[pos] = 0;
        if (!isValid(grid, pos, v)) {
          grid[pos] = v;
          return pos;
        }
        grid[pos] = v;
      }
      return -1;
    }

    function solve() {
      const grid = getGrid();

      // Check for input conflicts
      const conflict = validateInput(grid);
      if (conflict !== -1) {
        cells[conflict].classList.add('error');
        setStatus('Conflict detected in the puzzle — check highlighted cell', 'error');
        return;
      }

      // Mark given cells
      const given = grid.map(v => v !== 0);
      given.forEach((g, i) => {
        cells[i].className = 'cell' + (g ? ' given' : '');
      });

      const start = performance.now();
      const solvable = backtrack(grid);
      const elapsed = (performance.now() - start).toFixed(1);

      if (!solvable) {
        setStatus('No solution exists for this puzzle', 'error');
        return;
      }

      // Animate solution
      grid.forEach((v, i) => {
        if (!given[i]) {
          cells[i].value = v;
          cells[i].classList.add('solved');
        }
        cells[i].disabled = true;
      });

      setStatus(`Solved in ${elapsed} ms`, 'success');
    }
  </script>
</body>
</html>
