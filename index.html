<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku Experiment</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f13;
      color: #e8e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 24px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 28px;
      letter-spacing: 0.3px;
    }

    .board-wrapper {
      background: #1a1a24;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 0 0 1px #2a2a3a, 0 20px 60px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 520px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 2px;
      background: #2a2a3a;
      border: 3px solid #4c4c6a;
      border-radius: 8px;
      overflow: hidden;
    }

    /* Thick borders between 3x3 boxes */
    .cell {
      width: 52px;
      height: 52px;
      background: #1a1a24;
      border: none;
      outline: none;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 600;
      color: #e8e8f0;
      cursor: pointer;
      transition: background 0.15s;
      caret-color: #a78bfa;
    }

    .cell:focus { background: #252535; }
    .cell:hover:not(:focus) { background: #20202e; }

    /* Right border after columns 3 and 6 */
    .cell:nth-child(9n+3),
    .cell:nth-child(9n+6) {
      border-right: 3px solid #4c4c6a;
    }

    /* Bottom border after rows 3 and 6 */
    .cell:nth-child(n+19):nth-child(-n+27),
    .cell:nth-child(n+46):nth-child(-n+54) {
      border-bottom: 3px solid #4c4c6a;
    }

    .cell.given {
      color: #a78bfa;
    }

    .cell.solved {
      color: #34d399;
      animation: pop 0.2s ease;
    }

    .cell.error {
      color: #f87171;
      background: #2a1a1a;
    }

    /* User-entered number that is the only occurrence (determinant) */
    .cell.unique {
      color: #60a5fa;
      font-size: 1.3rem;
    }

    /* User-entered number that appears in more than one cell (candidate/pencil mark) */
    .cell.candidate {
      color: #fb923c;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    /* Hint step — shown by Next Step */
    .cell.hint {
      color: #fbbf24;
      font-size: 1.3rem;
      background: #221e0a;
      animation: pop 0.2s ease;
    }

    @keyframes pop {
      0%   { transform: scale(0.85); }
      60%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 22px;
      border-radius: 10px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }

    button:active { transform: scale(0.96); }

    .btn-solve {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
    }
    .btn-solve:hover { opacity: 0.9; }

    .btn-clear {
      background: #2a2a3a;
      color: #a0a0b8;
      border: 1px solid #3a3a4a;
    }
    .btn-clear:hover { background: #323244; color: #e8e8f0; }

    .btn-example {
      background: #2a2a3a;
      color: #a0a0b8;
      border: 1px solid #3a3a4a;
    }
    .btn-example:hover { background: #323244; color: #e8e8f0; }

    .btn-hint {
      background: linear-gradient(135deg, #b45309, #92400e);
      color: #fff;
      box-shadow: 0 4px 14px rgba(180, 83, 9, 0.3);
    }
    .btn-hint:hover { opacity: 0.9; }

    .btn-photo {
      background: #2a2a3a;
      color: #a0a0b8;
      border: 1px solid #3a3a4a;
    }
    .btn-photo:hover { background: #323244; color: #e8e8f0; }

    /* ── Hint explanation panel ─────────────────────────────────────────── */
    .hint-panel {
      display: none;
      margin-top: 14px;
      padding: 12px 16px;
      background: #16161f;
      border: 1px solid #3a3a2a;
      border-left: 3px solid #fbbf24;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #d1c7a3;
      line-height: 1.6;
    }
    .hint-panel.visible { display: block; }
    .hint-panel .technique {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #fbbf24;
      margin-bottom: 5px;
    }

    /* ── API key row ────────────────────────────────────────────────────── */
    .api-key-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .api-key-label {
      font-size: 0.75rem;
      color: #6b7280;
      white-space: nowrap;
    }
    .api-key-input {
      flex: 1;
      min-width: 0;
      padding: 6px 10px;
      border-radius: 7px;
      border: 1px solid #3a3a4a;
      background: #12121a;
      color: #e8e8f0;
      font-size: 0.78rem;
      font-family: monospace;
    }
    .api-key-input::placeholder { color: #4b5563; }
    .api-key-save {
      padding: 6px 14px;
      border-radius: 7px;
      border: none;
      background: #2a2a3a;
      color: #a0a0b8;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #3a3a4a;
    }
    .api-key-save:hover { background: #323244; color: #e8e8f0; }

    .status {
      margin-top: 14px;
      font-size: 0.82rem;
      text-align: center;
      min-height: 20px;
      color: #6b7280;
      letter-spacing: 0.3px;
    }
    .status.success { color: #34d399; }
    .status.error   { color: #f87171; }
    .status.loading { color: #fbbf24; }
  </style>
</head>
<body>

  <h1>Sudoku Experiment</h1>
  <p class="subtitle">Enter your puzzle and hit Solve</p>

  <div class="board-wrapper">
    <div class="board" id="board"></div>

    <div class="controls">
      <button class="btn-example" onclick="loadExample()">Load Example</button>
      <button class="btn-photo"   onclick="triggerImageUpload()">&#128247; Import Photo</button>
      <button class="btn-clear"   onclick="clearBoard()">Clear</button>
      <button class="btn-hint"    onclick="applyNextStep()">Next Step</button>
      <button class="btn-solve"   onclick="solve()">Solve</button>
    </div>

    <!-- hidden file input for image upload -->
    <input type="file" id="imageInput" accept="image/*" capture="environment"
           style="display:none" onchange="handleImageFile(this)" />

    <!-- API key (needed only for Import Photo) -->
    <div class="api-key-row">
      <span class="api-key-label">Anthropic API key (for photo import):</span>
      <input class="api-key-input" type="password" id="apiKeyInput"
             placeholder="sk-ant-..." autocomplete="off" />
      <button class="api-key-save" onclick="saveApiKey()">Save</button>
    </div>

    <div class="status" id="status"></div>
    <div class="hint-panel" id="hintPanel">
      <div class="technique" id="hintTechnique"></div>
      <div id="hintText"></div>
    </div>
  </div>

  <script>
    const board      = document.getElementById('board');
    const status     = document.getElementById('status');
    const hintPanel  = document.getElementById('hintPanel');
    const hintTech   = document.getElementById('hintTechnique');
    const hintText   = document.getElementById('hintText');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const cells = [];

    // Restore saved API key
    apiKeyInput.value = localStorage.getItem('anthropicApiKey') || '';

    // Build grid
    for (let i = 0; i < 81; i++) {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.maxLength = 1;
      inp.className = 'cell';
      inp.dataset.idx = i;
      inp.addEventListener('keydown', onKey);
      inp.addEventListener('input', onInput);
      board.appendChild(inp);
      cells.push(inp);
    }

    function onInput(e) {
      const v = e.target.value.replace(/[^1-9]/g, '');
      e.target.value = v ? v[v.length - 1] : '';
      e.target.classList.remove('solved', 'error', 'hint');
      setStatus('');
      hideHint();
      updateCandidateStyles();
    }

    function updateCandidateStyles() {
      const counts = new Array(10).fill(0);
      cells.forEach(c => {
        if (!c.classList.contains('given') && !c.classList.contains('hint') && c.value) {
          counts[parseInt(c.value)]++;
        }
      });

      cells.forEach(c => {
        if (c.classList.contains('given') || c.classList.contains('hint') || !c.value) {
          c.classList.remove('candidate', 'unique');
          return;
        }
        const digit = parseInt(c.value);
        if (counts[digit] > 1) {
          c.classList.add('candidate');
          c.classList.remove('unique');
        } else {
          c.classList.add('unique');
          c.classList.remove('candidate');
        }
      });
    }

    function onKey(e) {
      const idx = parseInt(e.target.dataset.idx);
      const moves = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 9, ArrowUp: -9 };
      if (moves[e.key] !== undefined) {
        e.preventDefault();
        const next = idx + moves[e.key];
        if (next >= 0 && next < 81) cells[next].focus();
      }
    }

    function getGrid() {
      return cells.map(c => parseInt(c.value) || 0);
    }

    function setStatus(msg, type = '') {
      status.textContent = msg;
      status.className = 'status ' + type;
    }

    function showHint(technique, html) {
      hintTech.textContent = technique;
      hintText.innerHTML = html;
      hintPanel.classList.add('visible');
    }

    function hideHint() {
      hintPanel.classList.remove('visible');
    }

    function clearBoard() {
      cells.forEach(c => {
        c.value = '';
        c.className = 'cell';
        c.disabled = false;
      });
      setStatus('');
      hideHint();
    }

    function loadExample() {
      clearBoard();
      const puzzle =
        '530070000' +
        '600195000' +
        '098000060' +
        '800060003' +
        '400803001' +
        '700020006' +
        '060000280' +
        '000419005' +
        '000080079';
      puzzle.split('').forEach((ch, i) => {
        if (ch !== '0') {
          cells[i].value = ch;
          cells[i].classList.add('given');
        }
      });
      setStatus('Example puzzle loaded');
    }

    // ── Solver ──────────────────────────────────────────────────────────────

    function isValid(grid, pos, num) {
      const row = Math.floor(pos / 9);
      const col = pos % 9;
      const boxRow = Math.floor(row / 3) * 3;
      const boxCol = Math.floor(col / 3) * 3;

      for (let i = 0; i < 9; i++) {
        if (grid[row * 9 + i] === num) return false;
        if (grid[i * 9 + col] === num) return false;
        const br = boxRow + Math.floor(i / 3);
        const bc = boxCol + (i % 3);
        if (grid[br * 9 + bc] === num) return false;
      }
      return true;
    }

    function getCandidates(grid, pos) {
      if (grid[pos] !== 0) return [];
      const result = [];
      for (let n = 1; n <= 9; n++) {
        if (isValid(grid, pos, n)) result.push(n);
      }
      return result;
    }

    function backtrack(grid) {
      const empty = grid.indexOf(0);
      if (empty === -1) return true;

      for (let num = 1; num <= 9; num++) {
        if (isValid(grid, empty, num)) {
          grid[empty] = num;
          if (backtrack(grid)) return true;
          grid[empty] = 0;
        }
      }
      return false;
    }

    function validateInput(grid) {
      for (let pos = 0; pos < 81; pos++) {
        const v = grid[pos];
        if (!v) continue;
        grid[pos] = 0;
        if (!isValid(grid, pos, v)) {
          grid[pos] = v;
          return pos;
        }
        grid[pos] = v;
      }
      return -1;
    }

    function solve() {
      hideHint();
      const grid = getGrid();

      const conflict = validateInput(grid);
      if (conflict !== -1) {
        cells[conflict].classList.add('error');
        setStatus('Conflict detected in the puzzle — check highlighted cell', 'error');
        return;
      }

      const given = grid.map(v => v !== 0);
      given.forEach((g, i) => {
        cells[i].className = 'cell' + (g ? ' given' : '');
      });

      const start = performance.now();
      const solvable = backtrack(grid);
      const elapsed = (performance.now() - start).toFixed(1);

      if (!solvable) {
        setStatus('No solution exists for this puzzle', 'error');
        return;
      }

      grid.forEach((v, i) => {
        if (!given[i]) {
          cells[i].value = v;
          cells[i].classList.add('solved');
        }
        cells[i].disabled = true;
      });

      setStatus(`Solved in ${elapsed} ms`, 'success');
    }

    // ── Next Step ────────────────────────────────────────────────────────────

    function findNextStep() {
      const grid = getGrid();

      if (validateInput(grid) !== -1) return { error: 'Fix conflicts before stepping' };
      if (!grid.includes(0)) return { done: true };

      // 1. Naked Single — only one candidate in a cell
      for (let pos = 0; pos < 81; pos++) {
        if (grid[pos] !== 0) continue;
        const cands = getCandidates(grid, pos);
        if (cands.length === 0) return { error: 'No solution exists for this puzzle' };
        if (cands.length === 1) {
          const row = Math.floor(pos / 9), col = pos % 9;
          const blocked = [1,2,3,4,5,6,7,8,9].filter(n => n !== cands[0]).join(', ');
          return {
            pos, value: cands[0],
            technique: 'Naked Single',
            explanation: `Cell R${row+1}C${col+1} can only be <b>${cands[0]}</b>. ` +
              `Every other digit (${blocked}) already appears in its row, column, or 3×3 box.`
          };
        }
      }

      // 2. Hidden Single in a row
      for (let num = 1; num <= 9; num++) {
        for (let row = 0; row < 9; row++) {
          const positions = [];
          for (let col = 0; col < 9; col++) {
            const pos = row * 9 + col;
            if (grid[pos] === 0 && isValid(grid, pos, num)) positions.push(pos);
          }
          if (positions.length === 1) {
            const pos = positions[0], col = pos % 9;
            return {
              pos, value: num,
              technique: 'Hidden Single — Row',
              explanation: `In row ${row+1}, the digit <b>${num}</b> can only fit in column ${col+1}. ` +
                `Every other empty cell in row ${row+1} is blocked from having ${num} by its column or box.`
            };
          }
        }
      }

      // 3. Hidden Single in a column
      for (let num = 1; num <= 9; num++) {
        for (let col = 0; col < 9; col++) {
          const positions = [];
          for (let row = 0; row < 9; row++) {
            const pos = row * 9 + col;
            if (grid[pos] === 0 && isValid(grid, pos, num)) positions.push(pos);
          }
          if (positions.length === 1) {
            const pos = positions[0], row = Math.floor(pos / 9);
            return {
              pos, value: num,
              technique: 'Hidden Single — Column',
              explanation: `In column ${col+1}, the digit <b>${num}</b> can only fit in row ${row+1}. ` +
                `Every other empty cell in column ${col+1} is blocked from having ${num} by its row or box.`
            };
          }
        }
      }

      // 4. Hidden Single in a 3×3 box
      for (let num = 1; num <= 9; num++) {
        for (let br = 0; br < 3; br++) {
          for (let bc = 0; bc < 3; bc++) {
            const positions = [];
            for (let i = 0; i < 9; i++) {
              const row = br * 3 + Math.floor(i / 3);
              const col = bc * 3 + (i % 3);
              const pos = row * 9 + col;
              if (grid[pos] === 0 && isValid(grid, pos, num)) positions.push(pos);
            }
            if (positions.length === 1) {
              const pos = positions[0];
              const row = Math.floor(pos / 9), col = pos % 9;
              return {
                pos, value: num,
                technique: 'Hidden Single — Box',
                explanation: `In the 3×3 box covering rows ${br*3+1}–${br*3+3}, columns ${bc*3+1}–${bc*3+3}, ` +
                  `the digit <b>${num}</b> can only fit in cell R${row+1}C${col+1}. ` +
                  `All other cells in this box are blocked from having ${num}.`
              };
            }
          }
        }
      }

      // 5. Trial & Error — most-constrained cell + backtracking to find correct value
      let minLen = 10, bestPos = -1, bestCands = [];
      for (let pos = 0; pos < 81; pos++) {
        if (grid[pos] !== 0) continue;
        const cands = getCandidates(grid, pos);
        if (cands.length < minLen) { minLen = cands.length; bestPos = pos; bestCands = cands; }
      }
      const solved = [...grid];
      backtrack(solved);
      const value = solved[bestPos];
      const row = Math.floor(bestPos / 9), col = bestPos % 9;
      return {
        pos: bestPos, value,
        technique: 'Trial & Error',
        explanation: `No single-step logic resolves the puzzle right now. ` +
          `Cell R${row+1}C${col+1} has ${minLen} candidates (${bestCands.join(', ')}). ` +
          `Deeper analysis confirms <b>${value}</b> is the only digit that leads to a valid solution.`
      };
    }

    function applyNextStep() {
      const step = findNextStep();

      if (step.error) { setStatus(step.error, 'error'); return; }
      if (step.done)  { setStatus('Puzzle is already solved!', 'success'); return; }

      const { pos, value, technique, explanation } = step;
      cells[pos].value = value;
      cells[pos].className = 'cell hint';
      cells[pos].disabled = false;

      showHint(technique, explanation);
      setStatus('');
    }

    // ── Image Import ─────────────────────────────────────────────────────────

    function saveApiKey() {
      const key = apiKeyInput.value.trim();
      if (key) {
        localStorage.setItem('anthropicApiKey', key);
        setStatus('API key saved', 'success');
      } else {
        localStorage.removeItem('anthropicApiKey');
        setStatus('API key cleared', '');
      }
    }

    function triggerImageUpload() {
      const key = (apiKeyInput.value.trim()) || localStorage.getItem('anthropicApiKey') || '';
      if (!key) {
        setStatus('Enter your Anthropic API key above before importing a photo', 'error');
        apiKeyInput.focus();
        return;
      }
      document.getElementById('imageInput').click();
    }

    function handleImageFile(input) {
      const file = input.files[0];
      if (!file) return;
      input.value = '';  // reset so same file can be re-selected

      const apiKey = (apiKeyInput.value.trim()) || localStorage.getItem('anthropicApiKey') || '';
      if (!apiKey) { setStatus('No API key set', 'error'); return; }

      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result.split(',')[1];
        const mediaType = file.type || 'image/jpeg';

        setStatus('Reading sudoku from photo…', 'loading');

        try {
          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01',
              'anthropic-dangerous-allow-browser': 'true'
            },
            body: JSON.stringify({
              model: 'claude-haiku-4-5-20251001',
              max_tokens: 200,
              messages: [{
                role: 'user',
                content: [
                  { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
                  { type: 'text',  text: 'This is a sudoku puzzle. Return ONLY the 81 digits of the grid, row by row, using 0 for empty cells. No spaces, no newlines, no explanation — exactly 81 digits.' }
                ]
              }]
            })
          });

          const data = await response.json();
          if (data.error) throw new Error(data.error.message);

          const digits = data.content[0].text.replace(/[^0-9]/g, '');
          if (digits.length !== 81) throw new Error(`Got ${digits.length} digits instead of 81 — try a clearer photo`);

          clearBoard();
          digits.split('').forEach((ch, i) => {
            if (ch !== '0') {
              cells[i].value = ch;
              cells[i].classList.add('given');
            }
          });
          setStatus('Puzzle loaded from photo', 'success');
          updateCandidateStyles();

        } catch (err) {
          setStatus('Could not read photo: ' + err.message, 'error');
        }
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
